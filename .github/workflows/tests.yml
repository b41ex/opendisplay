name: Tests

# Nothing checked pull requests before this, so a branch that did not compile
# (or a test target that could not build) only surfaced on someone's laptop.
on:
  pull_request:
  push:
    branches: [main, feature/receiver-catalina]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run tells us nothing, so drop in-flight runs for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      # Deliberately without DEVELOPMENT_TEAM: nothing built here is
      # distributed, so an unsigned build is enough, and needing no secrets
      # means this check also runs on pull requests from forks.
      - name: Generate project
        run: xcodegen generate

      # Builds the Mac app as well as the test bundle, since the scheme covers
      # both — so this is a compile check for the app on top of the tests.
      - name: Run macOS tests
        run: |
          xcodebuild test \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecarMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify Sender resolved Sparkle 2.9.6
        run: |
          jq -e '[.pins[] | select(.identity == "sparkle") | .state.version] == ["2.9.6"]' \
            OpenSidecar.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      # Shared protocol/receiver code is also compiled into the universal
      # iPhone+iPad app. Catch a mobile-only compile or asset failure on the
      # change that introduced it, before release-please creates a tag and the
      # release workflow attempts its TestFlight upload.
      - name: Build iOS and iPadOS receiver app
        run: |
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecariOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  receiver:
    name: Receiver ${{ matrix.label }} (${{ matrix.configuration }}, Xcode 16.4)
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            architectures: x86_64
            label: x86_64
          - configuration: Release
            architectures: x86_64
            label: x86_64
          - configuration: Release
            architectures: x86_64 arm64
            label: universal
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CONFIGURATION: ${{ matrix.configuration }}
      ARCHITECTURES: ${{ matrix.architectures }}
      ARCHITECTURE_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check preference model availability on Catalina
        run: |
          xcrun swiftc -typecheck -swift-version 5 \
            -target x86_64-apple-macosx10.15.7 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            MacReceiver/ReceiverPreferences.swift
      - name: Build unsigned receiver and package ZIP
        run: bash scripts/ci/receiver-build.sh
      - name: Preserve receiver ZIP and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-${{ matrix.label }}-${{ matrix.configuration }}-${{ github.sha }}
          path: build/receiver-evidence/
          if-no-files-found: error
      - name: Download the uploaded receiver artifact
        uses: actions/download-artifact@v4
        with:
          name: receiver-${{ matrix.label }}-${{ matrix.configuration }}-${{ github.sha }}
          path: build/receiver-downloaded/
      - name: Verify downloaded ZIP checksum, symlinks and executable bits
        run: |
          (cd build/receiver-downloaded && shasum -a 256 -c ../receiver-evidence/SHA256SUMS)
          python3 scripts/ci/verify-receiver-artifact.py zip \
            "build/receiver-downloaded/receiver-$ARCHITECTURE_LABEL-$CONFIGURATION.zip" \
            build/receiver-evidence/bundle-manifest.json
